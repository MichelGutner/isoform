# Every push to main (or next): run CI, then let semantic-release decide whether the
# commits since the last tag make a release. It publishes to npm with provenance, tags
# the commit, writes the GitHub release and commits CHANGELOG.md + package.json back.
name: Release

on:
  push:
    branches: [main, next]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write # tag, GitHub release, CHANGELOG commit
      issues: write # comment on the issues a release fixes
      pull-requests: write # comment on the merged pull requests
      id-token: write # npm provenance and trusted publishing
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn
          registry-url: https://registry.npmjs.org
      - run: yarn install --frozen-lockfile
      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # only for the first publish; then turn on trusted publishing on npmjs.com and delete it
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: >
          npx --yes
          -p semantic-release@26.0.1
          -p @semantic-release/changelog@7.0.0
          -p @semantic-release/git@11.0.1
          -p conventional-changelog-conventionalcommits@10.4.1
          semantic-release
